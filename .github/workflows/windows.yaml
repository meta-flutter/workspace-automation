name: windows

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    paths-ignore:
      - .github/workflows/macos.yaml
      - .github/workflows/ubuntu.yml
      - .github/workflows/ubuntu-legacy.yml
      - .github/workflows/fedora.yml
      - '**/*.md'
  release:
    types: [ published, created, edited ]
  workflow_dispatch:
  schedule:
    # daily
    - cron:  '0 0 * * *'

jobs:

  run:

    env:
      NONINTERACTIVE: 1
      HOMEBREW_NO_AUTO_UPDATE: 1

    strategy:
      matrix:
        os: [ windows-2022, windows-2025, windows-11-arm ]

    runs-on: ${{ matrix.os }}

    if: "!contains(github.event.pull_request.labels.*.name, 'ci: skip windows') && !contains(github.event.head_commit.message, '[skip windows]')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create workspace
        run: |
          git config --global core.longpaths true
          python3.exe -m pip install --upgrade pip
          python3.exe -m pip install virtualenv
          ./flutter_workspace.ps1 --enable=filament

      - name: Test workspace
        run: |
          ./setup_env.ps1
          flutter doctor -v
          dart --version
