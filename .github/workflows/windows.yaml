name: windows

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    paths-ignore:
      - .github/workflows/macos.yaml
      - .github/workflows/ubuntu.yml
      - .github/workflows/ubuntu-legacy.yml
      - .github/workflows/fedora.yml
      - '**/*.md'
  release:
    types: [ published, created, edited ]
  workflow_dispatch:
  schedule:
    # daily
    - cron:  '0 0 * * *'

jobs:

  run:

    env:
      NONINTERACTIVE: 1
      HOMEBREW_NO_AUTO_UPDATE: 1

    strategy:
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]

    runs-on: ${{ matrix.os }}

    if: "!contains(github.event.pull_request.labels.*.name, 'ci: skip windows') && !contains(github.event.head_commit.message, '[skip windows]')"

    steps:
      - name: Check Environment
        run: |
          echo "Running on Windows version: $(powershell -Command [System.Environment]::OSVersion.Version)"
          echo "Running on architecture: $(uname -m)"
          echo "Current directory: $(pwd)"
          echo "Environment variables:"
          env

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find libcurl in Windows CI
        run: |
          Write-Host "Searching for libcurl files in common locations..."
          
          # Search for libcurl files
          $searchPaths = @(
            "C:\Program Files",
            "C:\Program Files (x86)", 
            "C:\ProgramData",
            "C:\tools",
            "C:\vcpkg",
            "C:\hostedtoolcache",
            "C:\Windows\System32"
          )
          
          foreach ($path in $searchPaths) {
            if (Test-Path $path) {
              Write-Host "`nSearching in: $path"
              try {
                Get-ChildItem -Path $path -Recurse -Name "*curl*" -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object {
                  Write-Host "  Found: $path\$_"
                }
              } catch {
                Write-Host "  Could not search in $path (access denied)"
              }
            }
          }
          
          # Search for specific curl files
          Write-Host "`nSearching for specific curl files..."
          $curlFiles = @("libcurl.dll", "libcurl.lib", "curl.exe", "libcurl-d.lib")
          foreach ($file in $curlFiles) {
            Write-Host "Searching for $file..."
            Get-ChildItem -Path "C:\" -Recurse -Name $file -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object {
              Write-Host "  Found: $_"
            }
          }
          
          # Check environment variables
          Write-Host "`nChecking environment variables for curl paths..."
          Get-ChildItem Env: | Where-Object { $_.Name -match "curl|CURL" } | ForEach-Object {
            Write-Host "  $($_.Name) = $($_.Value)"
          }
          
          # Check if curl is in PATH
          Write-Host "`nChecking if curl is available in PATH..."
          try {
            $curlPath = Get-Command curl.exe -ErrorAction SilentlyContinue
            if ($curlPath) {
              Write-Host "  curl.exe found at: $($curlPath.Source)"
            } else {
              Write-Host "  curl.exe not found in PATH"
            }
          } catch {
            Write-Host "  Error checking for curl.exe"
          }

      - name: Create workspace
        env:
          CI: true
          GITHUB_ACTIONS: true
          PIP_PREFER_BINARY: "1"
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          git config --global core.longpaths true
          python3.exe -m pip install --upgrade pip
          python3.exe -m pip install virtualenv
          
          # Try to find libcurl path dynamically
          Write-Host "Looking for libcurl installation..."
          $curlPath = $null
          
          # Check common vcpkg locations first
          $vcpkgPaths = @(
            "C:\vcpkg\installed\x64-windows\lib",
            "C:\vcpkg\installed\arm64-windows\lib", 
            "C:\tools\vcpkg\installed\x64-windows\lib",
            "C:\tools\vcpkg\installed\arm64-windows\lib"
          )
          
          foreach ($path in $vcpkgPaths) {
            if (Test-Path "$path\libcurl.lib") {
              $curlPath = Split-Path $path -Parent
              Write-Host "Found libcurl in vcpkg at: $curlPath"
              break
            }
          }
          
          # If not found, try to locate curl.exe and derive path
          if (-not $curlPath) {
            try {
              $curlExe = Get-Command curl.exe -ErrorAction SilentlyContinue
              if ($curlExe) {
                $curlDir = Split-Path $curlExe.Source -Parent
                Write-Host "Found curl.exe at: $curlDir"
                # Try to find lib directory relative to curl.exe
                $possibleLibDirs = @(
                  "$curlDir\..\lib",
                  "$curlDir\lib", 
                  "$curlDir\..\lib\x64",
                  "$curlDir\..\lib\arm64"
                )
                foreach ($libDir in $possibleLibDirs) {
                  if (Test-Path "$libDir\libcurl.lib") {
                    $curlPath = Resolve-Path $libDir | Select-Object -ExpandProperty Path
                    $curlPath = Split-Path $curlPath -Parent
                    Write-Host "Found libcurl relative to curl.exe at: $curlPath"
                    break
                  }
                }
              }
            } catch {
              Write-Host "Could not locate curl.exe"
            }
          }
          
          # Install pycurl with or without curl-dir
          if ($curlPath) {
            Write-Host "Installing pycurl with curl-dir: $curlPath"
            python3.exe -m pip install pycurl --global-option=build_ext --global-option="--curl-dir=$curlPath"
          } else {
            Write-Host "libcurl not found, trying pycurl installation without curl-dir (may fail)..."
            try {
              python3.exe -m pip install pycurl
            } catch {
              Write-Host "pycurl installation failed, will rely on requests fallback in the Python code"
            }
          }
          
          Write-Host "Starting flutter_workspace.py..."
          ./flutter_workspace.ps1 --enable "filament-windows"

      - name: Test workspace
        env:
          CI: true
          GITHUB_ACTIONS: true
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          & .\setup_env.ps1
          dart --version
