name: fedora

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    paths-ignore:
      - .github/workflows/macos.yaml
      - .github/workflows/ubuntu.yml
      - .github/workflows/windows.yaml
      - '**/*.md'
  release:
    types: [ published, created, edited ]
  workflow_dispatch:
  schedule:
    # daily
    - cron:  '0 0 * * *'

jobs:
  run:
    strategy:
      matrix:
        os: [fedora:40, fedora:41, fedora:42]

    # NOTE: GitHub Actions does not support running on Fedora directly, so we run it in a container.
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.os }}

    if: "!contains(github.event.pull_request.labels.*.name, 'ci: skip fedora') && !contains(github.event.head_commit.message, '[skip fedora]')"

    steps:
      - name: Check Environment
        run: |
          echo "Running on Fedora version: $(cat /etc/fedora-release)"
          echo "Running on architecture: $(uname -m)"
          echo "Current directory: $(pwd)"
          echo "Environment variables:"
          env

      - name: Set up tools
        run: |
          dnf install -y python3 python3-pip which cmake
          python3 -m pip install --upgrade pip

      - name: Create non-root user
        run: |
          sudo groupadd -g 1000 user
          sudo useradd -m -u 1000 -g user -s /bin/bash user
          echo "user ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/user

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create workspace
        shell: bash
        # Run as non-root user in the container
        run: |
          su user; env
          cd $GITHUB_WORKSPACE
          pwd; ls -la
          chown -R user:user .
          ./flutter_workspace.py --enable=filament
          cat ./setup_env.sh

      - name: Test workspace
        shell: bash
        run: |
          su user; env
          cd $GITHUB_WORKSPACE
          pwd; ls -la
          . ./setup_env.sh
          dart --version

      - name: Test AOT creation
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          su user; env
          cd $GITHUB_WORKSPACE
          pwd; ls -la
          . ./setup_env.sh
          ./create_aot.sh --app-path=./flutter/examples/hello_world/
          ./flutter_workspace.py --create-aot --app-path=./flutter/examples/hello_world/
